# Safe Code 独立 HTTPS 后端；既有 443 SNI 入口只增加本域名映射。
limit_req_zone $binary_remote_addr zone=safe_code_api_global:1m rate=10r/s;
server {
    listen 80;
    server_name safecode.tommukan.dpdns.org;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://safecode.tommukan.dpdns.org$request_uri; }
}
server {
    listen 127.0.0.1:8446 ssl;
    server_name safecode.tommukan.dpdns.org;
    ssl_certificate /etc/letsencrypt/live/safecode.tommukan.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safecode.tommukan.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/safe-code-feedback-error.log crit;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 32k;
    client_body_timeout 8s;
    location ~ ^/(v1/(usage|feedback)|health)$ {
        limit_req zone=safe_code_api_global burst=30 nodelay;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        # 只作尽力限流，不用于身份认证。既有 TCP 转发不传递源地址。
        proxy_set_header X-SafeCode-Client-IP $http_cf_connecting_ip;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:18761;
    }
    location / { return 404; }
}
